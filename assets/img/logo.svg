<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="D'Licias Gourmet">
  <defs>
    <linearGradient id="ouro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#A67C1F"/>
      <stop offset="25%"  stop-color="#D4AF37"/>
      <stop offset="50%"  stop-color="#F7EBC0"/>
      <stop offset="75%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C1F"/>
    </linearGradient>
    <linearGradient id="rosa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FDF6F7"/>
      <stop offset="100%" stop-color="#FAE7EB"/>
    </linearGradient>
  </defs>

  <!-- Medalhão -->
  <ellipse cx="100" cy="100" rx="86" ry="94" fill="url(#rosa)"/>
  <ellipse cx="100" cy="100" rx="86" ry="94" fill="none" stroke="url(#ouro)" stroke-width="3"/>
  <ellipse cx="100" cy="100" rx="78" ry="86" fill="none" stroke="url(#ouro)" stroke-width="1" opacity=".7"/>

  <!-- Coroa -->
  <path d="M84 52 L92 40 L100 50 L108 40 L116 52 Z" fill="url(#ouro)"/>
  <circle cx="100" cy="36" r="3.5" fill="url(#ouro)"/>

  <!-- Nome -->
  <text x="100" y="112" text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, serif"
        font-size="46" font-style="italic" font-weight="700"
        fill="url(#ouro)">D'Licias</text>

  <text x="100" y="136" text-anchor="middle"
        font-family="Montserrat, Segoe UI, sans-serif"
        font-size="13" font-weight="600" letter-spacing="6"
        fill="#D9557B">GOURMET</text>

  <!-- Filete decorativo -->
  <path d="M64 150 Q100 162 136 150" fill="none" stroke="url(#ouro)" stroke-width="2" stroke-linecap="round"/>
</svg>
